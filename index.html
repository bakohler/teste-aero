<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AERO_NVT – Monitoramento de Voos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      background: #020617;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      color: #38bdf8;
    }

    nav a {
      color: #e5e7eb;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    nav a:hover {
      color: #38bdf8;
    }

    section {
      padding: 30px 20px;
    }

    section h2 {
      margin-top: 0;
      color: #38bdf8;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

    iframe {
      width: 100%;
      height: 550px;
      border: none;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #020617;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #020617;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>AERO_NVT</h1>
  <nav>
    <a href="#chegadas">Chegadas</a>
    <a href="#saidas">Saídas</a>
    <a href="#onground">On Ground</a>
    <a href="#radar">Radar Ao Vivo</a>
  </nav>
</header>

<section id="chegadas">
  <h2>Chegadas – Navegantes (NVT)</h2>
  <div class="card">
    <!-- iframe que você já usa (ex: FlightRadar / outro site permitido) -->
    <iframe src="https://www.flightradar24.com/airport/nvt"></iframe>
  </div>
</section>

<section id="saidas">
  <h2>Saídas – Navegantes (NVT)</h2>
  <div class="card">
    <iframe src="https://www.flightradar24.com/airport/nvt"></iframe>
  </div>
</section>

<section id="onground">
  <h2>Aeronaves no Solo</h2>
  <div class="card">
    <iframe src="https://www.flightradar24.com/airport/nvt"></iframe>
  </div>
</section>

<section id="radar">
  <h2>Radar Ao Vivo – Região de Navegantes</h2>
  <div class="card">
    <!-- ADS-B Exchange (FUNCIONA EM IFRAME) -->
    <iframe
      src="https://globe.adsbexchange.com/?lat=-26.88&lon=-48.65&zoom=9">
    </iframe>

    <a
      href="https://www.flightradar24.com/airport/nvt"
      target="_blank"
      class="btn">
      Abrir FlightRadar24 em nova aba
    </a>
  </div>
</section>

<footer>
  © AERO_NVT • Monitoramento de Aviação • Navegantes - SC
</footer>

</body>
</html>
